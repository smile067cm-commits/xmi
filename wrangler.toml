name = "xmi"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# -------------------------------------------------------------
# Cron Trigger: Runs every minute for scheduled posts & auto-deleting ephemeral messages
# -------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

# -------------------------------------------------------------
# KV Namespace (Optional for Multi-step Session Persistence)
# To create: `npx wrangler kv namespace create BOT_KV`
# -------------------------------------------------------------
# [[kv_namespaces]]
# binding = "BOT_KV"
# id = "YOUR_KV_NAMESPACE_ID"

# -------------------------------------------------------------
# Environment Variables
# -------------------------------------------------------------
[vars]
BOT_USERNAME = "Xminty_bot"
WEB_APP_URL = "https://xmi.lakshminighty1.workers.dev"

# -------------------------------------------------------------
# Secrets to set via Cloudflare Dashboard or `npx wrangler secret put`:
# 1. BOT_TOKEN
# 2. ADMIN_ID
# 3. CHANNEL_ID
# 4. SUPABASE_URL
# 5. SUPABASE_SERVICE_KEY
# 6. SECRET_TOKEN (Optional Telegram webhook security token)
# -------------------------------------------------------------
