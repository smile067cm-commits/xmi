name = "telegram-bot-hub"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# -------------------------------------------------------------
# Cron Trigger: Checks every 5 minutes for scheduled posts
# -------------------------------------------------------------
[triggers]
crons = ["*/5 * * * *"]

# -------------------------------------------------------------
# KV Namespace (Optional for Multi-step Session Persistence)
# To create: `npx wrangler kv namespace create BOT_KV`
# -------------------------------------------------------------
# [[kv_namespaces]]
# binding = "BOT_KV"
# id = "YOUR_KV_NAMESPACE_ID"

# -------------------------------------------------------------
# Environment Variables
# -------------------------------------------------------------
[vars]
# Put your bot username here without '@' (used for deep links in the web app)
BOT_USERNAME = "YourTelegramBot"
# Optional custom frontend URL (defaults to Worker URL if omitted)
# WEB_APP_URL = "https://telegram-bot-hub.yoursubdomain.workers.dev"

# -------------------------------------------------------------
# Secrets to set via `npx wrangler secret put <KEY>`:
# 1. BOT_TOKEN
# 2. ADMIN_ID
# 3. CHANNEL_ID
# 4. FIREBASE_URL
# 5. FIREBASE_SECRET
# 6. SUPABASE_URL
# 7. SUPABASE_SERVICE_KEY
# 8. SECRET_TOKEN (Optional Telegram webhook security token)
# -------------------------------------------------------------
